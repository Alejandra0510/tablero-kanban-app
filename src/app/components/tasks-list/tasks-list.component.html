<div class="flex gap-4 px-8 pt-5 pb-10">
  @for (col of columns(); track col.title) {
   <section class="sm:w-72 md:w-100 shrink-0 rounded-box bg-base-100 p-3 shadow">
     <header class="flex items-center justify-between px-1 pb-3">
       <h3 class="flex items-center gap-2 font-extrabold">
         <span class="size-2.5 rounded-full" [class]="col.dotClass"></span>
         {{ col.title }}
       </h3>
       <span class="badge badge-neutral badge-sm">{{ col.details.length }}</span>
     </header>

     <div class="flex flex-col gap-3">
       @for (task of col.details; track task.id) {
          <article [class]="`card cursor-grab card-border ${col.border}`">
            <div class="card-body p-4 gap-2.5">
              <h2 class="font-bold leading-snug">{{ task.title }}</h2>
              <p>
                {{ task.description}}
              </p>
              <div class="flex items-center justify-between">
                <div class="avatar avatar-placeholder">
                  <div [class]="utils.getPriority(task.priority)+' w-8 rounded-full text-[9.5px] font-extrabold'">
                    {{ task.priority }}
                  </div>
                </div>
                <span class="text-xs font-semibold opacity-70">{{ task.date }}</span>
              </div>
            </div>
          </article>
       }
       @empty {
         <span class="badge badge-soft badge-sm font-bold" class="bg-red-200">No hay tareas</span>
       }
     </div>

     <button
      class="btn btn-ghost border border-gray-500 btn-sm w-full mt-3"
      (click)="openModalNew()">
       <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
         <path d="M0 0h24v24H0z" fill="none" />
         <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M12 20v-8m0 0V4m0 8h8m-8 0H4" />
       </svg>
       Agregar tarjeta
     </button>
   </section>
  }
</div>
<task-modal-component />
