<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-lg bg-base-100 shadow-xl">
    <!-- <form class="card-body gap-4" [formGroup]="form" (ngSubmit)="onSubmit()"> -->
    <form class="card-body gap-4">
      <div class="flex items-center gap-2">
    <button
      type="button"
      class="btn btn-ghost btn-sm btn-circle"
      aria-label="Regresar"
      (click)="goBack()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <h2 class="card-title text-2xl">Nueva tarea</h2>
  </div>

      <!-- Título -->
      <label class="form-control w-full">
        <span class="label-text mb-1">Título</span>
        <input
          type="text"
          formControlName="title"
          placeholder="Ej. Diseñar pantalla de login"
          class="input input-bordered w-full"
          /* [class.input-error]="isInvalid('title')" */
        />
        <!-- @if (isInvalid('title')) {
          <span class="text-error text-sm mt-1">
            @if (form.controls.title.hasError('required')) {
              El título es obligatorio.
            } @else if (form.controls.title.hasError('minlength')) {
              Mínimo 3 caracteres.
            }
          </span>
        } -->
      </label>

      <!-- Descripción -->
      <label class="form-control w-full">
        <span class="label-text mb-1">Descripción</span>
        <textarea
          formControlName="description"
          rows="3"
          placeholder="Detalles de la tarea (opcional)"
          class="textarea textarea-bordered w-full"
          /* [class.textarea-error]="isInvalid('description')" */
        ></textarea>
      </label>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Columna -->
        <label class="form-control w-full">
          <span class="label-text mb-1">Columna</span>
          <select formControlName="status" class="select select-bordered w-full">
            <!-- @for (s of statuses; track s.value) {
              <option [value]="s.value">{{ s.label }}</option>
            } -->
          </select>
        </label>

        <!-- Prioridad -->
        <label class="form-control w-full">
          <span class="label-text mb-1">Prioridad</span>
          <select formControlName="priority" class="select select-bordered w-full">
            <!-- @for (p of priorities; track p.value) {
              <option [value]="p.value">{{ p.label }}</option>
            } -->
          </select>
        </label>
      </div>

      <!-- Fecha límite -->
      <label class="form-control w-full">
        <span class="label-text mb-1">Fecha límite</span>
        <input type="date" formControlName="dueDate" class="input input-bordered w-full" />
      </label>

      <div class="card-actions justify-end mt-2">
        <a routerLink="/kanban" class="btn btn-ghost">Cancelar</a>
        <!-- <button type="submit" class="btn btn-primary" [disabled]="form.invalid"> -->
        <button type="submit" class="btn btn-primary">
          Guardar tarea
        </button>
      </div>
    </form>
  </div>
</div>
